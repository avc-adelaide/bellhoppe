
name: Code Lint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    - name: Install dependencies
      run: uv sync --extra dev
    - name: Ruff
      run: make lintp
    - name: Type checking
      run: make typep
    - name: Fortitude
      run: make lintf

