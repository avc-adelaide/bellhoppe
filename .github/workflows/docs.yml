
name: Generate Coverage and Documentation

on:
  push:
    branches: [ "main" ]
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:


# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Cache apt packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: gfortran gcc graphviz
        version: 1.0

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y gfortran gcc graphviz

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Install additional tools
      run: uv tool install FORD

    - name: Run coverage
      run: |
        make cov

    - name: Move coverage reports to documentation
      run: |
        mkdir -p ./docs/static/coverage
        cp -r _coverage/        ./docs/static/coverage/
        cp -r _coverage_python/ ./docs/static/coverage/

    - name: Generate documentation
      run: |
        ls -lR docs
        make doc

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './docs/_build'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
